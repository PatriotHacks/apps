<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Booking | PatriotHacks</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        background-color: #ffffff;
        color: #0f1712;
        font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Header strip — sits directly above the embed. */
      .book-header {
        flex: none;
        padding: 16px 16px 10px;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 9999px;
        background-color: rgba(0, 0, 0, 0.03);
        border: 1px solid #e6e9e6;
        color: #0f1712;
        font-size: 14px;
        font-weight: 600;
        line-height: 1;
        text-decoration: none;
        transition: border-color 0.15s ease, color 0.15s ease,
          background-color 0.15s ease;
      }
      .back-link:hover {
        border-color: #006633;
        color: #006633;
      }

      /* Embed fills the rest of the viewport. */
      .book-main {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <header class="book-header">
      <a href="/sponsor" class="back-link" aria-label="Back to PatriotHacks sponsors">
        ← Back
      </a>
    </header>

    <main class="book-main">
      <!-- Cal inline embed code begins -->

</html>
